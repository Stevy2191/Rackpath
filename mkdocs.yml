# The Rackpath guide as a website (GitHub Pages). The pages are the Markdown
# files in docs/guide, which also read fine on GitHub itself.
#   pip install -r docs/requirements.txt && mkdocs serve
site_name: Rackpath guide
site_url: https://stevy2191.github.io/Rackpath/
repo_url: https://github.com/Stevy2191/Rackpath
edit_uri: edit/main/docs/guide/
docs_dir: docs/guide
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Home: README.md
  - Getting started:
      - Install: installation.md
      - First steps: first-steps.md
      - Places, racks and devices: places-and-devices.md
  - Documenting the network:
      - Ports and cabling: cabling.md
      - IP addresses: ip-addresses.md
      - VLANs and Wi-Fi: vlans-and-wifi.md
      - Templates and power: templates-and-power.md
  - Bringing data in:
      - Integrations: integrations.md
      - Network discovery: discovery.md
  - Running Rackpath:
      - Users and permissions: users-and-permissions.md
      - Reports, exports and moves: reports-and-moves.md
      - Backups and updates: backups-and-updates.md
      - Troubleshooting: troubleshooting.md
