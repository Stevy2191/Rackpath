services:
  rackpath-db:
    image: mariadb:11
    container_name: rackpath-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      # Published on localhost only, so the database isn't reachable from the
      # network. Change to "${DB_PORT:-3306}:3306" only if you really need
      # remote access, and change the default passwords first.
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - rackpath-db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rackpath-api:
    image: ${GHCR_NAMESPACE:-ghcr.io/stevy2191}/rackpath-api:${IMAGE_TAG:-latest}
    build:
      context: ./api
    container_name: rackpath-api
    restart: unless-stopped
    depends_on:
      rackpath-db:
        condition: service_healthy
    environment:
      # Fixed: the frontend's nginx.conf proxies /api/ to rackpath-api:3010
      # and is baked into the image.
      API_PORT: 3010
      DB_HOST: rackpath-db
      DB_PORT_INTERNAL: ${DB_PORT_INTERNAL:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      RACKPATH_JWT_SECRET: ${RACKPATH_JWT_SECRET:?Set RACKPATH_JWT_SECRET in .env}
      # Key for credentials stored in the database (64 hex characters).
      RACKPATH_ENCRYPTION_KEY: ${RACKPATH_ENCRYPTION_KEY:?Set RACKPATH_ENCRYPTION_KEY in .env (openssl rand -hex 32)}
      # Comma-separated browser origins allowed to call the API cross-origin.
      # Empty (the default) is right when the UI is served by rackpath-frontend.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Set to true when Rackpath is served over HTTPS so the session cookie
      # is marked Secure.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    # No host port: the web UI reaches the API over the compose network
    # (nginx proxies /api/), so the API isn't exposed on its own.
    volumes:
      - rackpath-uploads:/uploads

  rackpath-frontend:
    image: ${GHCR_NAMESPACE:-ghcr.io/stevy2191}/rackpath-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
    container_name: rackpath-frontend
    restart: unless-stopped
    depends_on:
      - rackpath-api
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  rackpath-db-data:
  rackpath-uploads:
