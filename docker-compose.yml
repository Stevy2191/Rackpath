# Rackpath: one container. The server serves the web app and the API, and
# keeps everything in one SQLite file in the rackpath-data volume.
#
# Optional: a Caddy container in front for HTTPS with a self-signed
# certificate. It runs when .env has COMPOSE_PROFILES=caddy (deploy.sh sets
# this when you choose it).
services:
  rackpath:
    image: ${GHCR_NAMESPACE:-ghcr.io/stevy2191}/rackpath:${IMAGE_TAG:-latest}
    build:
      context: .
    container_name: rackpath
    restart: unless-stopped
    ports:
      # deploy.sh sets RACKPATH_BIND_ADDRESS=127.0.0.1 with Caddy, so only
      # Caddy (and this machine) can reach Rackpath directly.
      - "${RACKPATH_BIND_ADDRESS:-0.0.0.0}:${RACKPATH_PORT:-8080}:8080"
    environment:
      # Required: 64 hex characters (openssl rand -hex 32). Encrypts the
      # integration secrets you store. Keep it with your backups.
      RACKPATH_ENCRYPTION_KEY: ${RACKPATH_ENCRYPTION_KEY:?Set RACKPATH_ENCRYPTION_KEY in .env (openssl rand -hex 32)}
      # The address people use, e.g. https://rackpath.example.com. Used for
      # invitation links and the QR codes in PDF reports.
      RACKPATH_PUBLIC_URL: ${RACKPATH_PUBLIC_URL:-}
      # true when Rackpath is reached over HTTPS (behind a TLS proxy).
      RACKPATH_COOKIE_SECURE: ${RACKPATH_COOKIE_SECURE:-false}
      # true when a reverse proxy sets X-Forwarded-For.
      RACKPATH_TRUST_PROXY: ${RACKPATH_TRUST_PROXY:-false}
      RACKPATH_AUDIT_RETENTION_DAYS: ${RACKPATH_AUDIT_RETENTION_DAYS:-}
      RACKPATH_LOG: ${RACKPATH_LOG:-info}
    volumes:
      - rackpath-data:/data

  # HTTPS with a certificate from Caddy's own local certificate authority.
  # Browsers warn until they trust that authority's root certificate (see
  # the README). Plain HTTP on RACKPATH_HTTP_PORT redirects to HTTPS.
  caddy:
    image: caddy:2
    profiles: ["caddy"]
    container_name: rackpath-caddy
    restart: unless-stopped
    command:
      - caddy
      - reverse-proxy
      - --from
      - https://${RACKPATH_HOSTNAME:-localhost}:${RACKPATH_HTTPS_PORT:-443}
      - --to
      - rackpath:8080
      - --internal-certs
    ports:
      - "${RACKPATH_HTTP_PORT:-80}:80"
      - "${RACKPATH_HTTPS_PORT:-443}:${RACKPATH_HTTPS_PORT:-443}"
    volumes:
      # Caddy's certificate authority and certificates.
      - caddy-data:/data
    depends_on:
      - rackpath

volumes:
  rackpath-data:
  caddy-data:
