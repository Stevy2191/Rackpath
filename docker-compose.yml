# Rackpath: one container. The server serves the web app and the API, and
# keeps everything in one SQLite file in the rackpath-data volume.
services:
  rackpath:
    image: ${GHCR_NAMESPACE:-ghcr.io/stevy2191}/rackpath:${IMAGE_TAG:-latest}
    build:
      context: .
    container_name: rackpath
    restart: unless-stopped
    ports:
      - "${RACKPATH_PORT:-8080}:8080"
    environment:
      # Required: 64 hex characters (openssl rand -hex 32). Encrypts the
      # integration secrets you store. Keep it with your backups.
      RACKPATH_ENCRYPTION_KEY: ${RACKPATH_ENCRYPTION_KEY:?Set RACKPATH_ENCRYPTION_KEY in .env (openssl rand -hex 32)}
      # The address people use, e.g. https://rackpath.example.com. Used for
      # invitation links and the QR codes in PDF reports.
      RACKPATH_PUBLIC_URL: ${RACKPATH_PUBLIC_URL:-}
      # true when Rackpath is reached over HTTPS (behind a TLS proxy).
      RACKPATH_COOKIE_SECURE: ${RACKPATH_COOKIE_SECURE:-false}
      # true when a reverse proxy sets X-Forwarded-For.
      RACKPATH_TRUST_PROXY: ${RACKPATH_TRUST_PROXY:-false}
      RACKPATH_AUDIT_RETENTION_DAYS: ${RACKPATH_AUDIT_RETENTION_DAYS:-}
      RACKPATH_LOG: ${RACKPATH_LOG:-info}
    volumes:
      - rackpath-data:/data

volumes:
  rackpath-data:
